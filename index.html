<!DOCTYPE html>
<!--
  منظومة الأمل للتدريب
  ملف الواجهة الرئيسي (HTML / CSS / JavaScript)
  الأقسام موضحة بالتعليقات لتسهيل التطوير والصيانة.
  تنبيه: بيانات التطبيق تُخزن محليًا في متصفح الجهاز.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منظومة الأمل للتدريب</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root {
  --gold:#D4AF37;
  --card:#161616;
  --line:#242424;
  --blue:#1d4ed8;
  --green:#15803d
}
* {
  box-sizing:border-box;
  font-family:Cairo,
  Tahoma,
  sans-serif
}
body {
  margin:0;
  background:#0a0a0a;
  color:#eee;
  background-image:radial-gradient(circle at 50% 0%,
  #1a1a1a 0%,
  #070707 70%);
  min-height:100vh
}
#loginScreen {
  position:fixed;
  inset:0;
  background:rgba(0,
  0,
  0,
  .88);
  backdrop-filter:blur(14px);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px
}
.loginBox {
  width:100%;
  max-width:380px;
  background:#151515;
  border:1px solid #2a2a2a;
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 60px #000
}
.loginBox h2 {
  color:var(--gold);
  text-align:center;
  margin:0 0 14px
}
header {
  background:#0f0f0f;
  border-bottom:1px solid var(--line);
  padding:14px;
  text-align:center;
  color:var(--gold);
  font-weight:800;
  font-size:20px
}
#userBar {
  font-size:12px;
  text-align:center;
  color:#777;
  padding:6px;
  background:#111
}
.wrap {
  max-width:1200px;
  margin:auto;
  padding:12px
}
.topBar {
  display:flex;
  gap:8px;
  overflow:auto;
  padding:8px 0
}
.topBar::-webkit-scrollbar {
  display:none
}
.topBar button {
  flex:1;
  min-width:110px;
  padding:10px 6px;
  font-size:13px;
  font-weight:700;
  border-radius:10px;
  border:1px solid #2a2a2a;
  background:#1c1c1c;
  color:#ddd;
  cursor:pointer;
  transition:.2s
}
.topBar button.activeGold {
  background:linear-gradient(180deg,
  #fde68a,
  #d4af37);
  color:#111;
  border-color:#d4af37
}
.topBar button:hover {
  transform:translateY(-1px);
  border-color:var(--gold)
}
.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-top:12px;
  display:none;
  box-shadow:0 10px 30px rgba(0,
  0,
  0,
  .4)
}
.card.active {
  display:block;
  animation:pop .2s
}
@keyframes pop {
  from {
    opacity:0;
    transform:translateY(8px)
  }
  to {
    opacity:1;
    transform:translateY(0)
  }
}
h3 {
  color:var(--gold);
  margin:6px 0 10px
}
input,
select,
textarea {
  width:100%;
  padding:10px;
  margin:4px 0;
  border-radius:9px;
  border:1px solid #2a2a2a;
  background:#0f0f0f;
  color:#fff;
  font-size:14px
}
.btn {
  width:100%;
  padding:11px;
  border-radius:10px;
  border:none;
  font-weight:800;
  cursor:pointer;
  margin:4px 0
}
.btn-gold {
  background:var(--gold);
  color:#111
}
.btn-blue {
  background:var(--blue);
  color:#fff
}
.btn-green {
  background:var(--green);
  color:#fff
}
.btn-red {
  background:#b91c1c;
  color:#fff
}
.tableBox {
  overflow:auto;
  border-radius:12px;
  border:1px solid #222;
  background:#fff;
  margin-top:10px
}
table {
  width:100%;
  border-collapse:collapse;
  min-width:750px;
  background:#fff;
  color:#111
}
th,
td {
  padding:8px 6px;
  font-size:12px;
  border-bottom:1px solid #eee;
  text-align:center
}
th {
  background:#111;
  color:var(--gold);
  position:sticky;
  top:0
}
.photo {
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #ddd
}
.moreWrap {
  position:relative;
  display:inline-block
}
.moreBtn {
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid #ddd;
  background:#fff;
  color:#111;
  cursor:pointer;
  font-weight:900
}
.moreList {
  position:absolute;
  left:0;
  top:34px;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  min-width:145px;
  padding:5px;
  display:none;
  z-index:50;
  box-shadow:0 12px 30px #000
}
.moreList.show {
  display:block
}
.moreList button {
  width:100%;
  text-align:right;
  background:none;
  border:none;
  color:#eee;
  padding:8px 10px;
  border-radius:6px;
  font-size:13px;
  cursor:pointer
}
.moreList button:hover {
  background:#222;
  color:var(--gold)
}
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,
  0,
  0,
  .7);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:14px
}
.modal.open {
  display:flex
}
.modalBox {
  width:95%;
  max-width:640px;
  max-height:92vh;
  overflow:auto;
  background:#171717;
  border:1px solid #2a2a2a;
  border-radius:18px;
  padding:18px;
  position:relative;
  box-shadow:0 30px 80px #000
}
.closeX {
  position:absolute;
  left:12px;
  top:12px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#222;
  border:1px solid #333;
  color:#fff;
  cursor:pointer;
  font-size:16px
}
#bigMsg {
  position:fixed;
  inset:0;
  background:rgba(0,
  0,
  0,
  .9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  color:var(--gold);
  font-size:28px;
  font-weight:bold;
  text-align:center
}
@media print {
  .no-print {
    display:none!important
  }
  body {
    background:#fff
  }
}
/* ===== تحسينات الواجهة وتجربة الاستخدام ===== */ :root  {

}
.closeX  {

}
.moreBtn  {

}
.moreList  {
  min-width:155px;

  background:#172131
}
.reportGrid  {
  display:grid;
  grid-template-columns:repeat(2,
  minmax(0,

}
.reportGrid>div  {
  padding:9px;

.reportGrid small,

.reportGrid small  {

}

#loginScreen  {

}

  .75)
}
@media(max-width:650px)  {
  .wrap  {
    padding:10px
  }

    grid-template-columns:repeat(3,

  }

</style>
</head>
<body>
<div id="loginScreen"><div class="loginBox"><h2>الأمل للتدريب</h2><input id="uName" placeholder="اليوزر"><input id="uPass" type="password" placeholder="الباسورد"><button class="btn btn-gold" onclick="authLogin()">دخول</button><button class="btn btn-blue" onclick="authCreate()" style="margin-top:6px">إنشاء حساب جديد</button><div style="margin-top:10px"><input type="file" id="importAcc" accept=".json"></div></div></div>
<div id="bigMsg"></div>
<header id="mainTitle">الأمل للتدريب</header>
<div id="userBar">غير مسجل</div>
<div class="wrap">
<div class="topBar no-print">
<button class="activeGold" onclick="app.go('general')">شعبة عامة</button>
<button class="activeGold" onclick="app.go('labs')">تحاليل</button>
<button class="activeGold" onclick="app.go('nursing')">تمريض</button>
<button onclick="app.go('affairs')">شئون الطلاب</button>
<button onclick="app.go('fees')">الأقساط</button>
<button onclick="app.settings()">الاعدادات</button>
</div>
<div id="general" class="card"><h3>شعبة عامة <span id="c_general"></span></h3><div class="tableBox"><table><thead><tr><th>صورة</th><th>كود</th><th>اسم</th><th>فرقة</th><th>فون</th><th>رمز</th><th>⋮</th></tr></thead><tbody id="tb_general"></tbody></table></div></div>
<div id="labs" class="card"><h3>تحاليل طبية <span id="c_labs"></span></h3><div class="tableBox"><table><thead><tr><th>صورة</th><th>كود</th><th>اسم</th><th>فرقة</th><th>فون</th><th>رمز</th><th>⋮</th></tr></thead><tbody id="tb_labs"></tbody></table></div></div>
<div id="nursing" class="card"><h3>تمريض <span id="c_nursing"></span></h3><div class="tableBox"><table><thead><tr><th>صورة</th><th>كود</th><th>اسم</th><th>فرقة</th><th>فون</th><th>رمز</th><th>⋮</th></tr></thead><tbody id="tb_nursing"></tbody></table></div></div>
<div id="affairs" class="card active">
<div style="display:flex;gap:6px"><button class="btn btn-green" style="flex:1" onclick="student.open()">+ طالب جديد</button><button class="btn btn-blue" style="flex:1" onclick="scanner.openCam()">📷 مسح كاميرا</button><button class="btn btn-gold" style="flex:1" onclick="printer.print24()">🖨️ طباعة 24 محدد</button></div>
<video id="cam" playsinline style="display:none;width:100%;border-radius:12px;margin-top:8px;border:1px solid #333"></video><canvas id="can" style="display:none"></canvas>
<div style="display:flex;gap:6px;margin-top:8px"><input id="search" placeholder="ابحث بالاسم او الكود او الفون" oninput="app.render()"><label style="display:flex;align-items:center;gap:4px;font-size:12px"><input type="checkbox" id="checkAll" onchange="selector.all(this.checked)"> اختيار الكل</label></div>
<input type="file" id="qrFile" accept="image/*" style="margin-top:6px">
<div class="tableBox"><table><thead><tr><th>✔</th><th>صورة</th><th>كود</th><th>اسم</th><th>شعبة</th><th>فون</th><th>رمز</th><th>اجراء</th></tr></thead><tbody id="tb_affairs"></tbody></table></div>
<h3>تقرير طالب</h3><select id="repSel" onchange="report.show()"></select><button class="btn btn-blue no-print" style="margin:8px 0" onclick="report.print()">🖨️ طباعة تقرير الطالب</button><div id="repBox" style="background:#0f0f0f;border:1px solid #222;padding:10px;border-radius:10px">اختار طالب</div>
</div>
<div id="fees" class="card"><h3>الأقساط</h3><div id="feeAlert" style="display:none;background:#2a0a0a;border:1px solid #5a1a1a;padding:10px;border-radius:10px;margin-bottom:8px"></div><select id="feeStu"></select><input id="feeTotal" type="number" placeholder="الاجمالي"><input id="feePaid" type="number" placeholder="المدفوع"><input id="feeDate" type="date"><button class="btn btn-green" onclick="fees.save()">حفظ القسط</button><input id="feeSearch" placeholder="ابحث في الاقساط" oninput="app.render()"><div class="tableBox"><table><thead><tr><th>#</th><th>الاسم</th><th>فون</th><th>كامل</th><th>دفع</th><th>باقي</th><th>معاد</th><th>⋮</th></tr></thead><tbody id="tb_fees"></tbody></table></div></div>
<div id="settings" class="card"><h3>الاعدادات</h3><label>اسم الاكاديمية</label><input id="setName"><label>لون الخلفية</label><input type="color" id="setBg"><button class="btn btn-blue" onclick="app.saveSet()">حفظ</button><button class="btn btn-red" style="margin-top:8px" onclick="authLogout()">تسجيل خروج</button></div>
</div>
<div id="stuModal" class="modal" onclick="if(event.target===this) student.close()"><div class="modalBox"><button class="closeX" onclick="student.close()">✕</button><h3 style="margin-top:2px">بيانات الطالب</h3><input type="hidden" id="editId"><input id="s_name" placeholder="الاسم كامل"><select id="s_div"><option value="">اختر الشعبة</option><option value="general">شعبة عامة</option><option value="labs">تحاليل طبية</option><option value="nursing">تمريض</option></select><input id="s_band" placeholder="الفرقة"><input id="s_phone" placeholder="فون الطالب"><input id="s_guard" placeholder="اسم ولي الامر"><input id="s_parent" placeholder="فون ولي الامر"><input id="s_nid" placeholder="الرقم القومي"><select id="s_gender"><option value="">الجنس</option><option>ذكر</option><option>أنثى</option></select><input id="s_dob" type="date"><textarea id="s_addr" placeholder="العنوان"></textarea><input id="s_photo" type="file" accept="image/*"><img id="s_prev" style="width:80px;height:80px;border-radius:50%;display:none;margin:8px auto;object-fit:cover;border:2px solid var(--gold)"><button class="btn btn-gold" onclick="student.save()">حفظ وتوليد الرمز</button></div></div>
<script>
// 1- التخزين
let USERS= {
}
;
try {
  USERS=JSON.parse(localStorage.getItem('amal_users')||'{}')
} catch {
}
let CUR=sessionStorage.getItem('amal_cur')||"";
let DB= {
  students:[],
  fees:[],
  attendance:[],
  lectures: {
    general:[],
    labs:[],
    nursing:[]
  }
  ,
  settings: {
    name:"الأمل للتدريب",
    bg:"#0a0a0a",
    pass:"1234"
  }
}
;
let tmpPhoto="",
isScanning=false,
picked=new Set();
function fresh() {
  return  {
    students:[],
    fees:[],
    attendance:[],
    lectures: {
      general:[],
      labs:[],
      nursing:[]
    }
    ,
    settings: {
      name:"الأمل للتدريب",
      bg:"#0a0a0a",
      pass:"1234"
    }
  }
}
function saveAll() {
  if(!CUR)return;
  USERS[CUR].data=DB;
  localStorage.setItem('amal_users',JSON.stringify(USERS));
  document.getElementById('userBar').textContent="داخل: "+CUR
}
// 2- الدخول
function authLogin() {
  let u=document.getElementById('uName').value.trim(),
  p=document.getElementById('uPass').value.trim();
  if(!USERS[u])return alert("اليوزر مش موجود");
  if(USERS[u].pass!==p)return alert("الباسورد غلط");
  CUR=u;
  DB=USERS[u].data;
  sessionStorage.setItem('amal_cur',u);
  hideLogin();
  app.applySet();
  app.render()
}
function authCreate() {
  let u=document.getElementById('uName').value.trim(),
  p=document.getElementById('uPass').value.trim();
  if(!u||!p)return alert("اكتب يوزر وباسورد");
  if(USERS[u])return alert("موجود قبل كده");
  USERS[u]= {
    pass:p,
    data:fresh()
  }
  ;
  CUR=u;
  DB=USERS[u].data;
  localStorage.setItem('amal_users',JSON.stringify(USERS));
  sessionStorage.setItem('amal_cur',u);
  hideLogin();
  app.render()
}
function authLogout() {
  sessionStorage.removeItem('amal_cur');
  CUR="";
  DB=fresh();
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('userBar').textContent="غير مسجل"
}
function hideLogin() {
  document.getElementById('loginScreen').style.display='none'
}
// 3- الواجهة
const app= {
  go(id) {
    document.querySelectorAll('.card').forEach(card=>card.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.topBar button').forEach(button=>button.classList.toggle('activeGold',button.getAttribute('onclick')?.includes(`'${id}'`)));
    this.render();
  }
  ,
  settings() {
    let p=prompt("باسورد الاعدادات");
    if(p===DB.settings.pass)this.go('settings');
    else if(p)alert("غلط")
  }
  ,
  applySet() {
    document.body.style.background=DB.settings.bg;
    document.getElementById('mainTitle').textContent=DB.settings.name;
    document.getElementById('setName').value=DB.settings.name;
    document.getElementById('setBg').value=DB.settings.bg
  }
  ,
  saveSet() {
    DB.settings.name=document.getElementById('setName').value;
    DB.settings.bg=document.getElementById('setBg').value;
    saveAll();
    this.applySet();
    alert("تم")
  }
  ,
  render() {
    drawDivs();
    drawAffairs();
    drawFees()
  }
  ,
  closeMenus() {
    document.querySelectorAll('.moreList').forEach(m=>m.classList.remove('show'))
  }
}
;
document.addEventListener('click',e=> {
  if(!e.target.closest('.moreWrap')) app.closeMenus();
  const modal=document.getElementById('stuModal');
  if(e.target===modal) student.close();
}
);
// 4- QR
const qrUtil= {
  draw(el,code) {
    el.innerHTML="";
    try {
      let q=qrcode(0,'M');
      q.addData(code);
      q.make();
      el.innerHTML=q.createSvgTag(3,5);
      let s=el.querySelector('svg');
      if(s) {
        s.style.width='70px';
        s.style.height='70px';
        s.style.background='#fff'
      }
    } catch {
      el.textContent=code
    }
  }
  ,
  svg(code) {
    let q=qrcode(0,'M');

// 9- الكاميرا وقراءة QR
const scanner =  {
  stream: null,
  async openCam()  {
    const video = document.getElementById('cam');
    video.style.display = 'block';
    if (!navigator.mediaDevices?.getUserMedia)  {
      alert('الكاميرا غير متاحة هنا. استخدم رفع صورة QR.');
      return;
    }
    try  {
      this.stream = await navigator.mediaDevices.getUserMedia( {
        video:  {
          facingMode: 'environment'
        }
      }
      );
      video.srcObject = this.stream;
      await video.play();
      this.scanLoop();
    } catch (error)  {
      alert('تعذر تشغيل الكاميرا. تأكد من السماح باستخدامها.');
    }
  }
  ,
  scanLoop()  {
    if (!this.stream) return;
    const video = document.getElementById('cam');
    const canvas = document.getElementById('can');
    const ctx = canvas.getContext('2d',  {
      willReadFrequently: true
    }
    );
    const scan = () =>  {
      if (!this.stream) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA)  {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const result = window.jsQR?.(image.data, image.width, image.height);
        if (result)  {
          this.stop();
          const studentRecord = DB.students.find(item => item.code === result.data.trim());
          if (studentRecord) attend(studentRecord.id, 'present');
          else alert('الرمز غير مسجل في قاعدة البيانات');
          return;
        }
      }
      requestAnimationFrame(scan);
    }
    ;
    requestAnimationFrame(scan);
  }
  ,
  stop()  {
    this.stream?.getTracks().forEach(track => track.stop());
    this.stream = null;
    const video = document.getElementById('cam');
    video.srcObject = null;
    video.style.display = 'none';
  }
}
;

      willReadFrequently: true
    }
    );
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;

    const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
    const result = jsQR(pixels.data, pixels.width, pixels.height);
    if (!result) return alert('لم يتم العثور على QR واضح في الصورة');
    const record = DB.students.find(item => item.code === result.data.trim());

function escapeHTML(value)  {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    student.close();
    app.closeMenus();
    scanner.stop();
  }
});

// بدء التشغيل واستعادة الجلسة عند وجودها
(function initializeApp() {
  if (CUR && USERS[CUR]?.data) {
    DB = USERS[CUR].data;
    DB.students ||= [];
    DB.fees ||= [];
    DB.attendance ||= [];
    DB.settings ||= fresh().settings;
    hideLogin();
    app.applySet();
    app.render();
  } else {
    CUR = '';
    sessionStorage.removeItem('amal_cur');
    document.getElementById('loginScreen').style.display = 'flex';
  }
})();
</script>
